<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create User</title><link rel="stylesheet" href="../assets/deliverable3.css"><style>body{font-family:Arial;margin:0;background:#f4f7f9}header{background:#2c7a7b;color:white;padding:20px}nav{display:flex;gap:15px;flex-wrap:wrap;margin-top:12px}nav a{color:white}main{max-width:760px;margin:30px auto;background:white;padding:28px;border-radius:8px}label{display:block;font-weight:bold;margin:14px 0 6px}input,select,textarea{width:100%;box-sizing:border-box;padding:11px}textarea{min-height:100px}.actions{margin-top:20px}.save{background:#2c7a7b;color:white;border:0;padding:10px 16px}.cancel{background:#eee;padding:10px 16px;text-decoration:none;color:#333}</style></head><body><header><h1>Barangay Health Center</h1><nav><a href="../patients/index.html">Patients</a><a href="../appointments/index.html">Appointments</a><a href="../medical-records/index.html">Medical Records</a><a href="../health-services/index.html">Health Services</a><a href="../users/index.html">Users</a></nav></header><main><h2>Create User</h2><div id="form-status" class="feedback feedback-info">Ready.</div><form data-crud-form data-endpoint="/users" data-fields="username,password,role"><label>Username</label><input name="username" type="text" maxlength="50" required><span class="field-error" data-error-for="username"></span><label>Password</label><input name="password" type="password" maxlength="100" required><span class="field-error" data-error-for="password"></span><label>Role</label><select name="role" required><option value="">Select</option><option>Administrator</option><option>Staff</option></select><span class="field-error" data-error-for="role"></span><div class="actions"><button class="save" type="submit">Save Record</button> <a class="cancel" href="index.html">Cancel</a></div></form></main><script src="../assets/crud-binding.js"></script></body></html>
