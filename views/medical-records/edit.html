<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Medical Record</title><link rel="stylesheet" href="../assets/deliverable3.css"><style>body{font-family:Arial;margin:0;background:#f4f7f9}header{background:#2c7a7b;color:white;padding:20px}nav{display:flex;gap:15px;flex-wrap:wrap;margin-top:12px}nav a{color:white}main{max-width:760px;margin:30px auto;background:white;padding:28px;border-radius:8px}label{display:block;font-weight:bold;margin:14px 0 6px}input,select,textarea{width:100%;box-sizing:border-box;padding:11px}textarea{min-height:100px}.actions{margin-top:20px}button,a{padding:10px 16px;border-radius:5px}.save{background:#2c7a7b;color:white;border:0}.cancel{background:#eee;text-decoration:none;color:#333}</style></head><body><header><h1>Barangay Health Center</h1><nav><a href="../patients/index.html">Patients</a><a href="../appointments/index.html">Appointments</a><a href="../medical-records/index.html">Medical Records</a><a href="../health-services/index.html">Health Services</a><a href="../users/index.html">Users</a></nav></header><main><h2>Edit Medical Record</h2><div id="form-status" class="feedback feedback-info">Ready.</div><form data-crud-form data-endpoint="/medical-records" data-fields="patientId,diagnosis,treatment,recordDate"><label>Patient ID</label><input name="patientId" type="number"  min="1" required><span class="field-error" data-error-for="patientId"></span><label>Diagnosis</label><textarea name="diagnosis" maxlength="500" required></textarea><span class="field-error" data-error-for="diagnosis"></span><label>Treatment</label><textarea name="treatment" maxlength="500" required></textarea><span class="field-error" data-error-for="treatment"></span><label>Record Date</label><input name="recordDate" type="date"   required><span class="field-error" data-error-for="recordDate"></span><div class="actions"><button class="save" type="submit">Save Record</button> <a class="cancel" href="index.html">Cancel</a></div></form></main><script src="../assets/crud-binding.js"></script></body></html>
