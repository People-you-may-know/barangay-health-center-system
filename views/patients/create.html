<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Patient - Barangay Health Center</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#333}
header{background:#2c7a7b;color:#fff;padding:20px} header h1{margin:0 0 15px}
nav{display:flex;gap:15px;flex-wrap:wrap} nav a{color:#fff;text-decoration:none}
main{max-width:700px;margin:30px auto;padding:30px;background:#fff;border-radius:8px;box-shadow:0 2px 8px #0002}
h2{color:#2c7a7b;margin-top:0}.description{color:#666;line-height:1.6}
form{display:flex;flex-direction:column}label{margin-top:15px;margin-bottom:6px;font-weight:bold}
input,select,textarea{width:100%;padding:11px;border:1px solid #ccc;border-radius:5px;font-size:15px;box-sizing:border-box}
textarea{min-height:100px;resize:vertical}.form-actions{display:flex;gap:10px;margin-top:25px;flex-wrap:wrap}
button,.cancel-button{padding:11px 20px;border-radius:5px;font-size:15px;font-weight:bold}
.save-button{background:#2c7a7b;color:#fff;border:0;cursor:pointer}.save-button:disabled{opacity:.65;cursor:not-allowed}
.cancel-button{background:#eee;color:#333;border:1px solid #ccc;text-decoration:none}
.feedback{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:15px 0;padding:12px;border-radius:5px}
.feedback-info{background:#eef7f7;color:#245f60}.feedback-loading{background:#eef7f7;color:#245f60}
.feedback-success{background:#edf7ed;color:#216e39}.feedback-error{background:#fff1f0;color:#a61b1b}
.field-error{display:block;min-height:18px;color:#b42318;font-size:13px;margin-top:4px}
@media(max-width:600px){main{margin:20px 10px;padding:20px}}
</style>
</head>
<body>
<header><h1>Barangay Health Center</h1><nav>
<a href="index.html">Patients</a><a href="../appointments/index.html">Appointments</a>
<a href="../medical-records/index.html">Medical Records</a><a href="../health-services/index.html">Health Services</a><a href="../users/index.html">Users</a>
</nav></header>
<main>
<h2>Add Patient</h2>
<p class="description">Enter the patient's information below.</p>
<div id="form-status" class="feedback feedback-info" role="status" aria-live="polite">Ready to save a new patient.</div>
<form id="patient-form" novalidate>
<label for="firstName">First Name</label>
<input id="firstName" name="firstName" maxlength="50" required>
<span class="field-error" data-error-for="firstName"></span>
<label for="lastName">Last Name</label>
<input id="lastName" name="lastName" maxlength="50" required>
<span class="field-error" data-error-for="lastName"></span>
<label for="dateOfBirth">Date of Birth</label>
<input id="dateOfBirth" name="dateOfBirth" type="date" required>
<span class="field-error" data-error-for="dateOfBirth"></span>
<label for="gender">Gender</label>
<select id="gender" name="gender" required><option value="">Select Gender</option><option>Male</option><option>Female</option><option>Other</option></select>
<span class="field-error" data-error-for="gender"></span>
<label for="contactNumber">Contact Number</label>
<input id="contactNumber" name="contactNumber" type="tel" pattern="09[0-9]{9}" maxlength="11" required>
<span class="field-error" data-error-for="contactNumber"></span>
<label for="address">Address</label>
<textarea id="address" name="address" minlength="5" maxlength="200" required></textarea>
<span class="field-error" data-error-for="address"></span>
<div class="form-actions"><button type="submit" class="save-button">Save Patient</button><a href="index.html" class="cancel-button">Cancel</a></div>
</form>
</main>
<script src="../assets/feedback.js"></script>
<script src="../assets/patient-form.js"></script>
</body>
</html>
