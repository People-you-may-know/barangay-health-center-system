<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Patient Error - Barangay Health Center</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f6f8;
            color: #333333;
        }

        header {
            background-color: #2c7a7b;
            color: #ffffff;
            padding: 20px;
        }

        header h1 {
            margin: 0 0 15px 0;
            font-size: 24px;
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            max-width: 700px;
            margin: 50px auto;
            padding: 40px 30px;
            background-color: #ffffff;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .error-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        h2 {
            margin: 0 0 15px 0;
            color: #b42318;
            font-size: 26px;
        }

        p {
            margin: 10px 0;
            color: #666666;
            line-height: 1.6;
        }

        .error-message {
            margin: 25px 0;
            padding: 15px;
            background-color: #fdecec;
            border: 1px solid #f5b5b5;
            border-radius: 5px;
            color: #8a1c1c;
            line-height: 1.6;
        }

        .button-group {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .button {
            display: inline-block;
            padding: 12px 20px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
        }

        .retry-button {
            background-color: #2c7a7b;
            color: #ffffff;
        }

        .retry-button:hover {
            background-color: #245f60;
        }

        .back-button {
            background-color: #eeeeee;
            color: #333333;
            border: 1px solid #cccccc;
        }

        .back-button:hover {
            background-color: #dddddd;
        }

        @media (max-width: 600px) {
            main {
                margin: 30px 15px;
                padding: 30px 20px;
            }

            header {
                padding: 15px;
            }

            header h1 {
                font-size: 20px;
            }

            nav {
                gap: 10px;
            }
        }
    </style>
</head>

<body>

    <header>

        <h1>Barangay Health Center</h1>

        <nav>
            <a href="index.html">Patients</a>
            <a href="../appointments/index.html">Appointments</a>
            <a href="../medical-records/index.html">Medical Records</a>
            <a href="../health-services/index.html">Health Services</a>
            <a href="../users/index.html">Users</a>
        </nav>

    </header>

    <main>

        <div
            class="error-icon"
            aria-hidden="true"
        >
            ⚠️
        </div>

        <h2>Unable to Load Patient Records</h2>

        <p>
            We were unable to retrieve the patient records at this time.
        </p>

        <div class="error-message">
            <strong>Error:</strong>
            Something went wrong while loading the patient records.
            Please try again.
        </div>

        <div class="button-group">

            <a
                href="index.html"
                class="button retry-button"
            >
                Try Again
            </a>

            <a
                href="create.html"
                class="button back-button"
            >
                Add Patient
            </a>

        </div>

    </main>

</body>
</html>
