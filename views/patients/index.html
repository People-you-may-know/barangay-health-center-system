<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Patient - Barangay Health Center</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            color: #333;
        }

        header {
            background-color: #2c7a7b;
            color: white;
            padding: 20px;
        }

        header h1 {
            margin: 0 0 10px 0;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 15px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            max-width: 700px;
            margin: 30px auto;
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h2 {
            margin-top: 0;
            color: #2c7a7b;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .form-actions {
            margin-top: 25px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #2c7a7b;
            color: white;
            font-size: 14px;
        }

        button:hover {
            opacity: 0.9;
        }

        .cancel-link {
            padding: 10px 18px;
            text-decoration: none;
            border: 1px solid #999;
            border-radius: 5px;
            color: #333;
            background-color: #f5f5f5;
        }

        .cancel-link:hover {
            background-color: #e5e5e5;
        }
    </style>
</head>

<body>

    <header>
        <h1>Barangay Health Center</h1>

        <nav>
            <a href="index.html">Patients</a>
            <a href="../appointments/index.html">Appointments</a>
            <a href="../medical-records/index.html">Medical Records</a>
            <a href="../health-services/index.html">Health Services</a>
            <a href="../users/index.html">Users</a>
        </nav>
    </header>

    <main>

        <h2>Edit Patient</h2>

        <p>Update the patient's information below.</p>

        <form>

            <label for="firstName">First Name</label>
            <input
                type="text"
                id="firstName"
                name="firstName"
                value="Juan"
                required
            >

            <label for="lastName">Last Name</label>
            <input
                type="text"
                id="lastName"
                name="lastName"
                value="Dela Cruz"
                required
            >

            <label for="dateOfBirth">Date of Birth</label>
            <input
                type="date"
                id="dateOfBirth"
                name="dateOfBirth"
                value="2000-01-15"
                required
            >

            <label for="gender">Gender</label>
            <select id="gender" name="gender" required>
                <option value="">Select Gender</option>
                <option value="Male" selected>Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>

            <label for="contactNumber">Contact Number</label>
            <input
                type="tel"
                id="contactNumber"
                name="contactNumber"
                value="09123456789"
                pattern="09[0-9]{9}"
                maxlength="11"
                required
            >

            <label for="address">Address</label>
            <textarea
                id="address"
                name="address"
                required
            >Sample Barangay Address</textarea>

            <div class="form-actions">
                <button type="submit">Update Patient</button>

                <a
                    href="index.html"
                    class="cancel-link"
                >
                    Cancel
                </a>
            </div>

        </form>

    </main>

</body>
</html>
