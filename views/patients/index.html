<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patient Records - Barangay Health Center</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#333}
header{background:#2c7a7b;color:#fff;padding:20px}header h1{margin:0 0 15px;font-size:24px}
nav{display:flex;flex-wrap:wrap;gap:15px}nav a{color:#fff;text-decoration:none}
main{max-width:1100px;margin:30px auto;padding:25px;background:#fff;border-radius:8px;box-shadow:0 2px 8px #0002}
.page-header{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:20px}
h2{margin:0;color:#2c7a7b}.add-button{padding:10px 16px;background:#2c7a7b;color:#fff;text-decoration:none;border-radius:5px;font-weight:bold}
.table-container{width:100%;overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:12px;border:1px solid #ddd;text-align:left}th{background:#2c7a7b;color:#fff}
tr:nth-child(even){background:#f8f9fa}.action-buttons{display:flex;gap:8px;flex-wrap:wrap}.edit-button,.delete-button{padding:7px 12px;border-radius:4px;font-weight:bold}
.edit-button{background:#eee;color:#333;border:1px solid #ccc;text-decoration:none}.delete-button{background:#b42318;color:#fff;border:0;cursor:pointer}.delete-button:disabled{opacity:.65;cursor:not-allowed}
.feedback{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:15px 0;padding:12px;border-radius:5px}
.feedback-info,.feedback-loading{background:#eef7f7;color:#245f60}.feedback-success{background:#edf7ed;color:#216e39}.feedback-error{background:#fff1f0;color:#a61b1b}
.retry-button{border:1px solid currentColor;background:transparent;border-radius:4px;padding:6px 10px;cursor:pointer}
@media(max-width:600px){main{margin:20px 10px;padding:15px}}
</style></head>
<body><header><h1>Barangay Health Center</h1><nav>
<a href="index.html">Patients</a><a href="../appointments/index.html">Appointments</a><a href="../medical-records/index.html">Medical Records</a><a href="../health-services/index.html">Health Services</a><a href="../users/index.html">Users</a>
</nav></header>
<main><div class="page-header"><h2>Patient Records</h2><a href="create.html" class="add-button">+ Add Patient</a></div>
<div id="list-status" class="feedback feedback-loading" role="status" aria-live="polite">Loading patients...</div>
<div class="table-container"><table><thead><tr><th>ID</th><th>First Name</th><th>Last Name</th><th>Date of Birth</th><th>Gender</th><th>Contact Number</th><th>Address</th><th>Actions</th></tr></thead>
<tbody id="patients-body"><tr><td colspan="8">Loading...</td></tr></tbody></table></div></main>
<script src="../assets/feedback.js"></script><script src="../assets/patients.js"></script>
</body></html>
