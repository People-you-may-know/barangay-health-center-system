<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Patient - Barangay Health Center</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f6f8;
            color: #333333;
        }

        header {
            background-color: #2c7a7b;
            color: #ffffff;
            padding: 20px;
        }

        header h1 {
            margin: 0 0 15px 0;
            font-size: 24px;
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            max-width: 700px;
            margin: 30px auto;
            padding: 30px;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h2 {
            margin-top: 0;
            color: #2c7a7b;
        }

        .description {
            color: #666666;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #cccccc;
            border-radius: 5px;
            font-size: 15px;
            font-family: Arial, Helvetica, sans-serif;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #2c7a7b;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .update-button {
            padding: 11px 20px;
            background-color: #2c7a7b;
            color: #ffffff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .update-button:hover {
            background-color: #245f60;
        }

        .cancel-button {
            display: inline-block;
            padding: 11px 20px;
            background-color: #eeeeee;
            color: #333333;
            border: 1px solid #cccccc;
            border-radius: 5px;
            text-decoration: none;
            font-size: 15px;
        }

        .cancel-button:hover {
            background-color: #dddddd;
        }

        .patient-id {
            padding: 12px;
            margin-bottom: 20px;
            background-color: #eef7f7;
            border: 1px solid #b7dddd;
            border-radius: 5px;
            color: #245f60;
        }

        .required-note {
            margin-top: 20px;
            font-size: 13px;
            color: #666666;
        }

        @media (max-width: 600px) {
            main {
                margin: 20px 10px;
                padding: 20px;
            }

            header {
                padding: 15px;
            }

            header h1 {
                font-size: 20px;
            }

            nav {
                gap: 10px;
            }
        }
    </style>
</head>

<body>

    <header>

        <h1>Barangay Health Center</h1>

        <nav>
            <a href="index.html">Patients</a>
            <a href="../appointments/index.html">Appointments</a>
            <a href="../medical-records/index.html">Medical Records</a>
            <a href="../health-services/index.html">Health Services</a>
            <a href="../users/index.html">Users</a>
        </nav>

    </header>

    <main>

        <h2>Edit Patient</h2>

        <p class="description">
            Update the patient's information below.
        </p>

        <div class="patient-id">
            <strong>Patient ID:</strong> 1
        </div>

        <form>

            <label for="firstName">
                First Name
            </label>

            <input
                type="text"
                id="firstName"
                name="firstName"
                value="Juan"
                maxlength="50"
                required
            >

            <label for="lastName">
                Last Name
            </label>

            <input
                type="text"
                id="lastName"
                name="lastName"
                value="Dela Cruz"
                maxlength="50"
                required
            >

            <label for="dateOfBirth">
                Date of Birth
            </label>

            <input
                type="date"
                id="dateOfBirth"
                name="dateOfBirth"
                value="2000-01-15"
                required
            >

            <label for="gender">
                Gender
            </label>

            <select
                id="gender"
                name="gender"
                required
            >
                <option value="">
                    Select Gender
                </option>

                <option value="Male" selected>
                    Male
                </option>

                <option value="Female">
                    Female
                </option>

                <option value="Other">
                    Other
                </option>
            </select>

            <label for="contactNumber">
                Contact Number
            </label>

            <input
                type="tel"
                id="contactNumber"
                name="contactNumber"
                value="09123456789"
                pattern="09[0-9]{9}"
                maxlength="11"
                required
            >

            <label for="address">
                Address
            </label>

            <textarea
                id="address"
                name="address"
                minlength="5"
                maxlength="200"
                required
            >Barangay Sample Address</textarea>

            <div class="form-actions">

                <button
                    type="submit"
                    class="update-button"
                >
                    Update Patient
                </button>

                <a
                    href="index.html"
                    class="cancel-button"
                >
                    Cancel
                </a>

            </div>

        </form>

        <p class="required-note">
            * All fields are required.
        </p>

    </main>

</body>
</html>
