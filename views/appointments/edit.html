<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Appointment - Barangay Health Center</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f7f9;
            color: #333;
        }

        header {
            background-color: #2c7a7b;
            color: white;
            padding: 20px;
        }

        header h1 {
            margin-bottom: 5px;
        }

        nav {
            margin-top: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 15px;
            font-size: 14px;
        }

        .container {
            width: 95%;
            max-width: 800px;
            margin: 30px auto;
        }

        .form-container {
            background-color: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        h2 {
            color: #2c7a7b;
            margin-bottom: 10px;
        }

        .description {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #2c7a7b;
        }

        .button-container {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        button,
        .cancel-button {
            padding: 11px 18px;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
        }

        .update-button {
            background-color: #2c7a7b;
            color: white;
            border: none;
        }

        .update-button:hover {
            background-color: #225e60;
        }

        .cancel-button {
            background-color: #e2e8f0;
            color: #333;
        }

        .cancel-button:hover {
            background-color: #cbd5e0;
        }

        .required {
            color: #e53e3e;
        }

        .appointment-id {
            background-color: #edf2f7;
            color: #555;
        }

        @media (max-width: 600px) {
            .container {
                width: 92%;
            }

            .form-container {
                padding: 18px;
            }

            nav a {
                display: inline-block;
                margin-bottom: 8px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Barangay Health Center</h1>
        <p>Patient Record and Appointment Management System</p>

        <nav>
            <a href="../patients/index.html">Patients</a>
            <a href="index.html">Appointments</a>
            <a href="../medical-records/index.html">Medical Records</a>
            <a href="../health-services/index.html">Health Services</a>
            <a href="../users/index.html">Users</a>
        </nav>
    </header>

    <main class="container">

        <div class="form-container">

            <h2>Edit Appointment</h2>

            <p class="description">
                Update the appointment information below.
            </p>

            <form>

                <div class="form-group">
                    <label for="appointmentId">
                        Appointment ID
                    </label>

                    <input
                        type="number"
                        id="appointmentId"
                        name="appointmentId"
                        value="1"
                        class="appointment-id"
                        readonly
                    >
                </div>

                <div class="form-group">
                    <label for="patientId">
                        Patient ID <span class="required">*</span>
                    </label>

                    <input
                        type="number"
                        id="patientId"
                        name="patientId"
                        value="1"
                        min="1"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="date">
                        Appointment Date <span class="required">*</span>
                    </label>

                    <input
                        type="date"
                        id="date"
                        name="date"
                        value="2026-09-25"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="time">
                        Appointment Time <span class="required">*</span>
                    </label>

                    <input
                        type="time"
                        id="time"
                        name="time"
                        value="09:00"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="service">
                        Service <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="service"
                        name="service"
                        value="Medical Checkup"
                        maxlength="100"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="status">
                        Status <span class="required">*</span>
                    </label>

                    <select id="status" name="status" required>
                        <option value="Scheduled" selected>
                            Scheduled
                        </option>

                        <option value="Completed">
                            Completed
                        </option>

                        <option value="Cancelled">
                            Cancelled
                        </option>
                    </select>
                </div>

                <div class="button-container">

                    <button
                        type="submit"
                        class="update-button"
                    >
                        Update Appointment
                    </button>

                    <a
                        href="index.html"
                        class="cancel-button"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </main>

</body>
</html>
